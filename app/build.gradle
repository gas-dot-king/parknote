import java.util.Properties

plugins {
    id 'com.android.application'
}

def releasePropertiesFile = rootProject.file('keystore.properties')
def releaseProperties = new Properties()
def hasReleaseSigning = releasePropertiesFile.isFile()
if (hasReleaseSigning) {
    releasePropertiesFile.withInputStream { releaseProperties.load(it) }
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { key ->
        if (!releaseProperties.getProperty(key)?.trim()) {
            throw new GradleException("keystore.properties에 ${key} 값을 설정하세요.")
        }
    }
}

android {
    namespace 'com.ohdduck.parknote'
    compileSdk 35

    defaultConfig {
        // Google Play에 첫 AAB를 올리면 이 ID는 영구적으로 고정된다.
        applicationId 'com.ohdduck.parknote'
        minSdk 26
        targetSdk 35
        versionCode 15
        versionName '3.3'
    }

    signingConfigs {
        debug {
            def projectDebugKeystore = rootProject.file('debug.keystore')
            if (projectDebugKeystore.isFile()) {
                storeFile projectDebugKeystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseProperties.getProperty('storeFile'))
                storePassword releaseProperties.getProperty('storePassword')
                keyAlias releaseProperties.getProperty('keyAlias')
                keyPassword releaseProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // 난독화 여부와 R8 예외는 기존 rules.pro에서 관리한다.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    rootProject.file('rules.pro')
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
        // 소스 배치가 표준(src/main/java)이 아니라 테스트 소스셋도 직접 지정해야 한다.
        test {
            java.srcDirs = ['test']
        }
    }

    testOptions {
        unitTests {
            // android.jar 스텁을 부르면 예외 대신 기본값을 돌려준다. 아래 테스트는
            // 안드로이드 API를 건드리지 않는 순수 로직만 다루지만, 안전망으로 둔다.
            returnDefaultValues = true
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // android.jar의 org.json은 전부 스텁이다. 실제 구현을 테스트 클래스패스 앞에 둔다.
    // (AGP는 mockable-android.jar를 항상 마지막에 놓으므로 이쪽이 이긴다.)
    testImplementation 'org.json:json:20240303'
}

tasks.configureEach {
    if (name == 'preReleaseBuild' || name == 'bundleRelease' || name == 'assembleRelease') {
        doFirst {
            if (!hasReleaseSigning) {
                throw new GradleException(
                        '출시 빌드에는 저장소 밖의 keystore.properties와 upload key가 필요합니다. ' +
                        'keystore.properties.example을 복사해 설정하세요.')
            }
        }
    }
}
